## 分析纪律

- 逐维度给 1-2 句具体观察（带原文证据段落位置），**不要空泛**（「句式多变」无效，「短句 3-7 字连发 + 偶尔 30 字长句收束」有效）。
- dim 之间冗余关系：dim9→dim33、dim11→dim29、dim35↔dim32（标「参见」省重复）。
- **dim32 知识差三态（D3·读者-角色信息差）**：每个信息差点先填 `gap_code` 受控值（reader_adv=读者已知角色不知 / reader_disadv=角色已知读者不知 / double_blind=都不知）再写 summary；拿不准的点标 `confidence=low` 不强凑（照 B7 防漂移纪律·绝不为枚举硬套）。这是「信息差流上帝视角 vs 悬疑蒙读者」的硬指纹。
- **B7 节奏序列防漂移**（dim49-53）：先逐场景自由观察「这一拍干了什么」再归类节拍类型，**不为凑枚举硬套**；张力/翻转判断给原文段落位置证据，估不准给区间；钩子兑现间隔数不准则填 null（绝不编造章距）。
- **dim51 张力机制三向度**（Sternberg·读者-文本信息差·「为什么紧张」的骨）：每个张力点的 `tension_type` 三选一照三句填空判——(a) 读者已知有炸弹/危险存在、还没爆、在等它爆 = `suspense`；(b) 结果/异象先抛出、因未知，读者想知道「到底发生了啥/为什么」= `curiosity`；(c) 关键信息被作者 withhold，临到揭晓才反转打脸读者预期 = `surprise`；这一拍没有信息差张力（纯过场/纯情绪起伏）= `none`，判不准就填 `none` **不硬凑**。每点必附 `span`（原文起句 20 字内）作定位证据。`tension` 数值只抓「多紧张」，`tension_type` 抓「为什么紧张」——两者正交。
- **per_scene_rationale（作者决策 rationale 链·D1）**：只填本 cluster 最能体现作者思维的 2-4 处岔路口决策（不求全）；`decision_type` 必从枚举单选；`the_what` 必带原文证据（≤30 字摘录·无证据宁可不填·**绝不编造**）；`the_why` 必须是**因果**不是复述 `the_what`；`gap_filled` 必须给**具体的通用写法对照**（泛泛说「更有文学性」无效）。这是从「作者倾向 Y」到「作者为什么这么决策」的画骨。
- 可选扩展包（升级文升级节奏 / 幻想文金手指 / 有反派的反派质量）按题材自动判断启用，写进 `free_notes`。
- 输出**纯 JSON**（无 markdown 围栏、无前后解说）。结构破损会被 driver 重试，但**内容/枚举判断绝不因重试被纠**。"""
