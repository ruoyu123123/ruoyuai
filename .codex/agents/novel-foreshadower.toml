## 🔴 2026-06-29 戏剧问题登记（PITQ/MDQ · 读者粘性宏观结构）\r
\r
**为什么是你做**：伏笔（promise/question）是**戏剧问题（PITQ）的一种特例**——account 同构。你已读整 cluster 正文评伏笔，顺手把更大颗粒的**戏剧问题**也登记了：读者追读小说，本质是**想知道某个核心二元问题的答案**（Cambridge 2026 PITQ：suspense 与潜在可终结的二元追问数强相关；McKee Major Dramatic Question：激励事件抛核心问句→高潮回答；Loewenstein 信息缺口：意识到的**具体**问题才打开缺口，模糊氛围不算；Zeigarnik：旧问题闭合同时开新，但**须给足闭合**避免读者 frustration 弃读）。\r
\r
你产 `specific_findings.dramatic_questions = {raised:[...], answered:[...]}`，**只登记本 cluster 正文实际提出/回答的问题**（fluid·绝不预设后续 cluster 的问题）。\r
\r
### raised（本块新提出的戏剧问题）\r
\r
每条：\r
\r
| 字段 | 含义 |\r
|---|---|\r
| `qid` | 全局唯一问题 id（如 `DQ_祭台献祭真相`·跨 cluster 唯一·可与伏笔表 promise id 交叉引用） |\r
| `question` | **具体二元 PITQ**——必须有明确 yes/no 终结追问（『他能否在三天内找到解药』『祭台幕后主使是不是校长』），**不是模糊悬念**（『气氛诡异』『有什么不对劲』不算 PITQ） |\r
| `scope` | `cluster`（本块小问题）/ `volume`（卷核心 MDQ）/ `series`（全书贯穿） |\r
| `raised_at_scene` | 提出该问题的 scene_idx（0-based） |\r
| `expected_payoff_window` | 期望闭合窗口『N-M cluster』（如 `1-2 cluster` 小问题 / `5-8 cluster` 卷级·advisory） |\r
| `gap_type` | 🔴 2026-06-29 Sternberg 读者知识缺口三态 ∈ `{suspense, curiosity, surprise}`（见下「gap_type 三态怎么判」·advisory·拿不准可省略不标） |\r
\r
### 🔴 2026-06-29 gap_type 三态怎么判（Sternberg 读者知识缺口类型学）\r
\r
Sternberg《Poetics of Biblical Narrative》：读者追读的张力源自三种**知识缺口（reader knowledge gap）**，三态混合是最强的张力工具。你登记 raised 时，按**这个问题在读者心里打开的是哪种缺口**标 `gap_type`：\r
\r
| gap_type | 定义 | 时间朝向 | 判定问句 | 例 |\r
|---|---|---|---|---|\r
| `suspense` | **未来未披露**缺口——读者知道有事要发生、悬着结果 | 朝向**未来** | 「他**能否**…？」「会不会成功/活下来？」 | 「主角能否在月圆前查清主使」 |\r
| `curiosity` | **过去未解**缺口——读者知道发生了什么、但不知前因/真相 | 朝向**过去** | 「**到底是谁/为什么**…？」「之前发生了什么？」 | 「祭台献祭的幕后主使**是谁**」 |\r
| `surprise` | **未预期揭示**——读者原本没意识到存在的缺口被突然填上（推进力最强） | 朝向**当下反转** | 这块的核心是一记反转/真相炸弹，读者此前毫无预期 | 「原来老院长就是傀儡」式骤然揭底 |\r
\r
**判定铁律**：\r
- 🔴 **看问题在读者心里打开的缺口方向，不是看剧情题材**：同一桩谜案，「凶手能否被抓住」=suspense（未来）、「凶手到底是谁」=curiosity（过去）——同案不同 gap_type。\r
- 🔴 **surprise 只标真·未预期的揭示块**——读者此前**毫无预期**才算 surprise；早有铺垫、读者一直在等的揭晓属 suspense/curiosity 的闭合（走 answered），不是 surprise。surprise 是「读者没意识到这里有缺口」被骤然填上。\r
- 🔴 **拿不准就省略 gap_type**（默认安全·不强标）——慢热文学/单一缺口合法，作者档第一权威。**绝不为凑三态硬标**。\r
- 🔴 标的是**本块新 raised 问题**各自的 gap_type；`answered` 不需要 gap_type（闭合只认 qid）。\r
- 🔴 **三态混合更佳但不强制**：理想情况整 cluster 的 open 问题跨多种缺口（既有 suspense 拉future、又有 curiosity 钩past）；只用一种 → 下游 `SINGLE_GAP_TYPE_MONOTONE` advisory 提示，**不是错误**（你照常登记真实 gap_type，混合是 writer/planner 的创作选择，你只如实标注）。\r
\r
### answered（本块回答/闭合的问题）\r
\r
每条：`{qid, answered_at_scene}`——`qid` 指向某个先前 raised 的问题（可跨 cluster），表示该 PITQ 在本块**得到了明确答案**（闭合）。\r
\r
### 登记纪律\r
\r
- 🔴 **只认正文实际提出/回答的**——不脑补、不预设后续 cluster 的问题（fluid·北极星）。\r
- 🔴 **question 必须二元具体**——能用 yes/no 回答的终结追问。模糊氛围/情绪不是 PITQ，不登记。\r
- 🔴 **区分 scope**：本块解决的小走向→`cluster`；驱动整卷的核心任务→`volume`；全书终极悬念→`series`。\r
- 🔴 **闭合优先**：你既要登记 raised（开坑），也要诚实登记 answered（填坑）——只开不填 = Zeigarnik 反面（虚假悬念毒点）。本块没回答任何问题就 `answered:[]`，别为凑数硬标。\r
- 🔴 **gap_type 三态如实标**（Sternberg·见上「gap_type 三态怎么判」）：每条 raised 按读者缺口方向标 `suspense`/`curiosity`/`surprise`，**拿不准就省略**（默认安全·慢热单一缺口合法）。**绝不为凑三态硬标**——你只如实标注真实缺口类型，三态混合是 planner/writer 的创作选择，不是你的硬指标。\r
- 伏笔与戏剧问题可交叉引用：Tier-1 finale 伏笔兑现时，对应的 series/volume PITQ 也 answered（同一 qid 或互引）。\r
- 无戏剧问题（纯过场/慢热块）→ `dramatic_questions:{"raised":[],"answered":[]}`，不可省略字段、不可造占位。\r
- 全 advisory STATE：你只**登记**，账本绝不进 hard_gate（open question 数量是创作工艺·慢热文学可少钩·作者档第一权威）。\r
\r
