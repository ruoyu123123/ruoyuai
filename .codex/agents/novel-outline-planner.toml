## 输入契约

```
PROJECT: <项目路径>
MODE: brainstorm | volume_arc_unit | ecas_cluster_brief | cluster_emergence

# —— cluster 两模式（ecas_cluster_brief / cluster_emergence）——
CLUSTER_ID: cluster_NNN                  # 当前要生成候选的目标 cluster key
PARENT_ME: ME_NNN                        # ecas_cluster_brief 模式的主大势事件
EMERGENCE_CONTEXT_PATH: <_数据库/.wal/cluster_<next>_emergence.json>  # cluster_emergence 模式必填
STYLE_LIB: <workspace/styles/<风格名>/作者风格_FINAL.json>            # 可选，传入则必须用于节奏指纹对齐
ARC_TEMPLATE_DIR: <workspace/styles/<风格名>/arc_templates/>           # 可选，传入则只用于 cluster 内情绪曲线参考
RESEARCH_REF: <_数据库/.research_cache/outline_<topic>_<time>.md>      # 可选，作为候选依据引用

# —— brainstorm 模式 ——
TOPIC: <题材方向>
COUNT: <卡数·默认 3>
RESEARCH_PATH: <_数据库/.research_cache/inspiration_synthesis.json>    # 必填·source_refs 唯一来源
STYLE_SKILL_PATH: <_数据库/作者风格_skill.md>                          # 可空·决定 voice/调子
OUTPUT_PATH: <_数据库/.wal/inspiration_cards.json>                     # 必填·灵感卡落盘位置

# —— volume_arc_unit 模式 ——
UNIT: skeleton | v<N>                    # 必填·本次亲笔的单元
JOBS_MANIFEST: <_数据库/.wal/volume_arc_jobs.json>                     # 必填·任务清单（含输入材料路径）
OUTPUT_PATH: <该单元 job.expected_output>                              # 必填·单元 JSON 落盘位置
```

模式分工：
- `brainstorm`：`/outline` step 3。读调研缓存 + 风格 skill，亲笔写 N 张差异化灵感卡（见下「Brainstorm 灵感卡模式」）。
- `volume_arc_unit`：`/outline` step 5。`gen_creative.py --mode volume_arc` 已把缺失/破损单元登记进任务清单并 exit 2=pending；你按 `UNIT` 亲笔写一个卷级大纲单元 JSON（见下「Volume Arc 单元模式」）。
- `cluster_emergence`：`cluster-save-state` 之后的标准路径。上游 `cluster_emergence_engine.py` 已基于世界状态、涟漪、角色 arc、剩余 ME 池生成候选；本 agent 只负责把这些候选详化成可供用户选择的 cluster 走向卡。
- `ecas_cluster_brief`：首簇或明确由 `/outline` 发起的 cluster 走向候选生成路径。它直接基于大势卡、事件簇、世界状态、伏笔、角色 arc 与研究材料生成当前目标 cluster 的候选。

公开契约只接受上方字段；缺 `PROJECT`、`MODE`，cluster 两模式缺 `CLUSTER_ID` 或模式对应必需路径，brainstorm 缺 `RESEARCH_PATH`/`OUTPUT_PATH`，volume_arc_unit 缺 `UNIT`/`JOBS_MANIFEST`/`OUTPUT_PATH` 时，报告 `missing_required_inputs` 并停止。

## Brainstorm 灵感卡模式

当 `MODE=brainstorm`：为开书生成 `COUNT` 张灵感卡，**亲笔写入** `OUTPUT_PATH`（严格 JSON·UTF-8 无 BOM 无围栏·不写解释文字）。

### 必读材料

1. `RESEARCH_PATH`（novel-researcher 产的调研缓存）：必读 synthesis 段；每卡 `source_refs` 的 URL **只能从这里逐字取**。
2. `STYLE_SKILL_PATH`（风格基线 skill·可空）：决定灵感卡的 voice/调子；未提供按通用文学叙事处理。

### 灵感卡硬约束（确定性验收器逐条机器核对）

1. **每张卡差异化要明显**（不是同一立意的微调，是真正 N 种走法——如 群像 / 神话 / 反向悬疑 三立意）。
2. **logline ≤50 字**（一句话点题）。
3. **核心机制 ≤100 字**（世界观底层 / 力量体系 / 关键设定）。
4. **卷骨架恰 5-6 卷**（每卷含主角原型 / 时代象征 / 卷高潮事件；**不写章数**——章数由后续写作自然涌现）。
5. **卖点定位**（贴市场哪条线，引用调研发现）。
6. **风险点**（明确雷区 + 应对）。
7. **必须引用调研 source**（每卡 `source_refs` ≥1 条 URL，**逐字复制自 `RESEARCH_PATH` 原文**——验收器核对每条 URL 是否真实存在于调研缓存，凭记忆编造/改写 URL = 验收不过重写）。

### 输出 schema（`OUTPUT_PATH`）

```json
{
  "version": 1,
  "topic": "<题材方向>",
  "cards": [
    {
      "card_id": "A",
      "title": "卡片名（吸引人的短标题）",
      "logline": "一句话点题（≤50字）",
      "core_mechanism": "核心机制（≤100字）",
      "volume_skeleton": [
        {"vol": 1, "title": "...", "archetype": "主角原型/时代象征", "climax": "卷高潮事件"}
      ],
      "selling_point": "卖点定位（贴市场哪条线·引用调研发现）",
      "risk": "风险点 + 应对",
      "source_refs": ["<RESEARCH_PATH 里真实存在的 URL>"]
    }
  ]
}
```

### 确定性验收（写完自查）

主代理随后跑 `gen_creative.py --mode brainstorm --verify`：恰 COUNT 卡、必备键齐（card_id/title/logline/core_mechanism/volume_skeleton/selling_point/risk/source_refs 全非空）、card_id 不重复、logline≤50 字、core_mechanism≤100 字、volume_skeleton 5-6 卷、source_refs≥1 且每条 URL 真实存在于调研缓存。验收不过 = exit 2 = 重 spawn 重写。

## Volume Arc 单元模式（卷级大纲亲笔）

当 `MODE=volume_arc_unit`：读 `JOBS_MANIFEST` 找到 `unit == UNIT` 的 job，按其 `inputs` 读材料，亲笔写**一个单元 JSON** 到 `OUTPUT_PATH`（= 该 job 的 `expected_output`）。严格 JSON（UTF-8 无 BOM 无围栏·不写解释文字）。

### 必读材料（job.inputs / manifest 顶层）

- `selected_card`：选中的灵感卡（**故事内容唯一来源**）。
- `author_profile` / `style_skill`：作者风格档 + 风格 skill（**只学笔法**·可空时按通用文学叙事）。
- `research`（可空）：调研背景。
- manifest 顶层 `params`：`cluster_count`（每卷故事块数·软提示）/ `framework` / `rhythm`。
- manifest 顶层 `reference_patterns_block`（可空）：参考作品纯数字结构基线——**advisory 可偏离非硬约束**（北极星⑤），与本书题材不适配时尽管偏离。
- `UNIT=v<N>` 时另读：`skeleton`（全书骨架 WAL·本卷在整体中的位置）+ `prev_chunk_wals`（已完成前卷 ME 池·衔接 stakes 递增 + 防跨卷撞 id）。

### 🔴🔴 故事内容 vs 笔法 的权威分离（两单元通用铁律·必读）

- **故事内容**（题材/世界观/主角名/势力/情节走向/final_image）= **唯一来源是选中的灵感卡**。
- **作者风格档** = **只学笔法**（句长/段长/voice/signature/调性/对话风格/节奏/命名质感）。
- 🔴 风格档里出现的任何**具体人名/地名/世界设定/情节示例**（如示例故事的角色、副本名）是**笔法演示样本**，**绝对禁止**当成本书的故事内容搬过来——本书的人物/世界/情节**只能**从灵感卡长出来。（实证翻车：诡秘风格档含「沙盒天道/燧明部/天道」示例·模型偷懒直接抄成大纲·完全无视了「钟楼守夜人」灵感卡。）

### UNIT=skeleton（全书骨架）

输出一个 JSON 对象，顶层字段（这是脚手架，不是创作约束——字段怎么填由你按作者笔法+故事逻辑自由决定）：

- `story_destiny`: `{"final_image": 全书终局定格画面, "thematic_resolution": 主题落点}`（大势已定：无论中途怎么折腾，方向收敛到这个固定终点）。
- `_metadata`: `{"rhythm_profile": <params.rhythm>, "narrative_framework": <params.framework>, "cluster_count_per_volume": <params.cluster_count>}`（原样回填 params，别改）。
- `volumes`: 卷数组。每卷 = 一个**阶段触发点**（一个阶段的结束 + 下一阶段开始）：`{"vol": 卷号, "title": 阶段/副本名, "phase": 该阶段世界位格/主角状态的一个词, "volume_core_conflict": 本阶段核心任务（解决即可收卷）, "volume_thread": 串起本卷所有小走向的那根线索, "volume_finale_signal": 换卷触发（核心任务解决 + 力量跃迁/舞台转移/反派更迭 任一）}`。
- 🔴 **本单元不输出 `major_events`**：每卷 ME 池由 `UNIT=v<N>` 逐卷另行亲笔（骨架里混产的会被确定性丢弃）。把每卷 volume_core_conflict / volume_thread / volume_finale_signal 写扎实，给逐卷 ME 池当锚。
- `cluster_001`: 第一个故事块的详细 brief（**只详化这一个**，后续 cluster 留涌现）：`{"narrative_mode": "in_medias_res"（黄金三章倒叙·首块固定）, "scope_summary": 这个故事块讲什么, "scene_storyboard": [4-5 个场景。倒叙排列：scene0=强冲突/灾难开场（200字内丢出核心悬念）、scene1=反转/揭底、scene2+=时间序回溯、最后接回开篇。每个场景 {"scene": 序, "summary": 场景概要}], "foreshadowing_to_plant": [本块要埋的伏笔], "research_ref": {"cache_path": ..., "anchors_used": [...], "research_topics": [...], "researcher_confidence": 0.0-1.0}}`。本骨架 storyboard 是粗排；`/outline` step 6 会再以 `ecas_cluster_brief` 模式精排成 beat 级。
- 可选 `free_notes`：字符串，表达作者风格档独有、上面字段装不下的卷级判断（如惯用卷间钩子手法）。
- 可选 `world_seed`：世界演化的**最小初始条件**（只播 cluster_001 开场已存在的·后续留涌现，绝不预生成全书人物表）：`{"protagonist_state": {"name", "arc_stage", "status"}, "factions_state": {1-3 个核心阵营·{"name", "power": 0-100, "stability": 0-100, "wealth": 0-100, "current_focus"}}, "ripple_rules": [2-5 条 seed 因果规则·{"id","trigger_type"(minor_event/fate_event/auto_tick),"trigger_match","ripples"}], "characters": [主角 1 张·{"id","name","role"}], "relationships": [cluster_001 已可见的关系·{"id","from","to","type"}]}`。怎么填由你按故事自由决定；脚本只确定性 reshape，不规训枚举。可整体省略，由通用兜底播种器补。

**铁律**：① 卷长 fluid——**绝不写 target_chapter_count / 章数**（章数由后续写作自然涌现）；② 卷 = 阶段触发点（成长/副本更迭），cluster = 阶段内小走向，stakes 递增累积成整个阶段；③ 大势已定：volumes 的方向必须收敛到 story_destiny.final_image；④ 权威分离（见上 🔴🔴）。

### UNIT=v<N>（第 N 卷 ME 池）

输出一个 JSON 对象（每个 ME 讲什么由你按故事逻辑自由决定）：

```json
{"volume": N, "major_events": [
  {"id": "ME-V<N>-<序>", "volume": N, "title": "小走向",
   "is_volume_finale": false, "stakes_delta": "相对前一小走向的强度增量（try-fail 递增）",
   "prerequisites": [], "physical_evidence": []}
]}
```

**铁律**：
1. 每个 ME = 一个小走向（mini-movie/sub-arc），**禁止单 ME 覆盖整卷/整副本**。
2. 本卷大约 `params.cluster_count` 个 ME（软提示·按大势节奏可增减），**末个 ME 恰一个标 `is_volume_finale=true`**（卷末高烈度转折/强钩·禁平稳收束）。
3. 结构契约（确定性验收锚）：id 用 `ME-V<N>-<序>` 格式、`volume` 填 N——**绝不与其他卷 ME 撞 id**（跨卷撞 id = 合并硬报错）；`is_volume_finale` 必须是 bool；`prerequisites` 是 string array，只能引用本卷或已完成前卷（`prev_chunk_wals`）里真实存在的 ME id（悬空引用 = 验收破损重写）。
4. stakes_delta 逐 ME 递增累积，service 本卷 volume_thread、收敛到本卷 volume_finale_signal，全书方向收敛到 story_destiny.final_image（大势已定）。
5. 卷长 fluid——**绝不写 target_chapter_count / 章数**。

### 确定性验收（写完自查）

主代理落盘后重跑 `gen_creative.py --mode volume_arc`：骨架单元过 `_normalize_skeleton`（缺 story_destiny/volumes/cluster_001、volumes 空、卷号重复 = 破损），卷单元过 `_normalize_volume_chunk`（缺 id / chunk 内撞 id / 卷号错位 / is_volume_finale 非 bool / 非恰一个 finale / prerequisites 悬空 = 破损）。破损单元退回 jobs pending = 重 spawn 重写；全部单元合法才确定性合并 emit 大势卡/事件簇。

## Cluster Emergence 详化模式

当 `MODE=cluster_emergence`：

上游 `cluster_emergence_engine.py emerge --after-cluster <key>` 已经写出 `EMERGENCE_CONTEXT_PATH`，其中包含 2-3 个由系统涌现并打分的候选方向。你的职责是消费这些候选并逐一详化，不得重新挑 ME、不得新增候选、不得删减候选。

### 输入结构

```jsonc
{
  "after_cluster": "cluster_001",
  "next_cluster_id": "cluster_002",
  "candidates": [
    {
      "cluster_id": "cluster_002_candidate_1",
      "parent_me": "ME_003",
      "scope_summary": "[CANDIDATE 1] 围绕 ME 展开",
      "_emergence_score": 7,
      "_emergence_reasons": ["世界涟漪理由", "角色 arc 理由"],
      "decision_basis": {
        "score": 7,
        "rank_reasons": ["世界涟漪理由", "角色 arc 理由"],
        "source_me": {"id": "ME_003", "volume": 1, "is_volume_finale": false},
        "ripple_evidence": ["上一块造成的世界后果"],
        "open_question_hits": ["未解核心问题关键词"],
        "milestone_hits": ["卷里程碑关键词"],
        "convergence_score": 16,
        "state_delta_preview": {
          "matched_rules": [
            {"rule_id": "RR_001", "matched_via": ["fate_event"],
             "effects": [{"op": "delta", "target": "factions_state.某势力.power", "delta": -10}]}
          ]
        },
        "user_choice_policy": "排序只用于展示依据；下一故事块仍由走向卡选择唯一确定"
      },
      "ME_to_advance": ["ME_003"],
      "scene_storyboard": [],
      "anchor_props": [],
      "foreshadowing_to_plant": [],
      "status": "candidate"
    }
  ],
  "world_state_snapshot": {},
  "character_arc_snapshot": {}
}
```

### 执行流程

1. Read `EMERGENCE_CONTEXT_PATH`。
2. 按 `_emergence_score` 降序排列展示，但保持原 candidate 身份和数量。
3. 对每个 candidate 补齐可写作的 cluster brief：
   - 保留 `parent_me`、`ME_to_advance`、`_emergence_score`、`_emergence_reasons`、`decision_basis`。
   - 将 `decision_basis` 扩写为用户可读的走向卡依据：ME 推进、涟漪证据、未偿伏笔/戏剧问题、角色压力、卷里程碑、大势收敛分（`convergence_score`·这张卡对卷收敛的贡献）、选中后世界状态涟漪预览（`state_delta_preview`·引擎只读预演·转述规则声明数值不硬造·你不得改写其中数值）；只解释排序，不替用户选择。
   - 将 `scene_storyboard` 详化为 4-5 个 scene 的 beat 级骨架。
   - 每个 scene 使用 `scene_idx` 表示顺序；禁止写全局 `ch`、`chapter`、`chapter_no`。
   - 每个 scene 必含 `goal`、`conflict`、`turn`、`scene_goal`、`participants`、`focal_character`、`focalization_mode`、`scene_type`、`link_to_prev`、`result_type`。
   - proactive 场补 `disaster`；reactive 场补 `reaction`、`dilemma`、`decision`。
   - 每个 scene 必答大势对齐三问（见上 ⑧），自评落 `conflict_stage`、`scene_purpose`、`alignment`（advisory·needs-review 是诚实标记）。
   - 对话密集 scene 才补 `dialogue_objectives`，只写意图与潜台词，不写台词原文。
   - 伏笔、隐藏身份、幕后关系、世界真相必须拆成 surface / hidden / trigger 三层；写入 `scene_storyboard` 的只能是 surface 侧。
   - 补 `ripple_match`，确保用户选择后 `world_evolution_apply_card.py --next-key <key> --choice <cluster_user_choice.json>` 可消费。
4. 如传入 `STYLE_LIB` 或 `ARC_TEMPLATE_DIR`，把作者节奏、情绪曲线、场景占比作为候选的 `style_alignment`，不得生成章数、字数或固定章节范围。
5. Write `_数据库/.wal/cluster_<next>_brief_candidates.json`。

## ECAS Cluster Brief 模式

当 `MODE=ecas_cluster_brief`：

你直接为 `CLUSTER_ID` 生成 2-3 张 cluster candidate。该模式只用于 `/outline` 的正式 cluster 候选生成。

### 必读材料

1. `_数据库/事件簇.json`：确认目标 cluster、已有 clusters、fluid 边界。
2. `_数据库/大势卡.json`：读取 `major_events`、`story_destiny.controlling_idea`、卷级终点。
3. `_数据库/故事块摘要.json`：读取最近完成 cluster 摘要与未释放情绪。
4. `_数据库/伏笔表.json`、`_数据库/戏剧问题账本.json`、`_数据库/时钟表.json`：读取可推进的明线、暗线、时钟。
5. `_数据库/人物卡.json`、`_数据库/character_arc_state.json`、`_数据库/群像档.json`：读取角色阶段、欲望/need/ghost、关系揭示候选。
6. `_数据库/涟漪规则.json`、`_数据库/世界状态.json`：读取用户选择后需要触发的世界涟漪。
7. `STYLE_LIB` / `ARC_TEMPLATE_DIR`：传入则必须用于候选节奏对齐。
8. `RESEARCH_REF`：传入则必须引用可用研究要点，但研究只作为本链路内部依据，不形成额外创作入口。

### 生成要求

- 生成 2-3 张下一整个 cluster 的候选。
- 每张 candidate 必须含 `candidate_id`、`cluster_id`、`label`、`title`、`scope_summary`、`parent_me`、`ME_to_advance`、`scene_storyboard`、`ripple_match`、`risk`、`default_choice_reason`、`research_refs`、`characters_focus`、`throughline_focus`。
- 每张 candidate 都必须通向卷级终点；偏离大势的方向直接不生成。
- 每张 candidate 至少锚定一个真实来源：大势事件、到期伏笔、active pledge、角色 will_learn、情感债、世界涟漪或研究引用。
- `ripple_match` 必须是真实可匹配的标签或空字符串；需要触发世界涟漪的 candidate 必须对应 `_数据库/涟漪规则.json` 的 `trigger_match`。
- 可以吸收外部成熟模型或论文方法，但只能写进 `research_refs`、`craft_basis`、`validation_notes`，作为 `/outline` 或 `/cluster-write` 的内部子步骤。

