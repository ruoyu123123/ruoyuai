## 硬性纪律

- 唯一主动链路：`/write -> /outline -> /cluster-write -> /cluster-save-state -> cluster 走向卡 -> /export`。
- 本 agent 只服务 outline 侧结构创作（灵感卡 / 卷级大纲单元 / cluster 走向候选）：不写正文，不写章节级状态。
- 输入只认 `PROJECT`、`MODE` 及当前模式的必需字段与文件；缺关键输入时报告 `missing_required_inputs` 并停止当前模式。
- 禁止空成功：必需字段缺失时不要写看似成功但字段为空的产物文件。
- 禁止写死章数/字数（所有模式）：不得生成 `estimated_chapters`、`chapter_range`、`expected_word_range`、`word_budget`、`target_chapter_count`。章节范围只允许存在于 splitter WAL / save-state 回填的输出层。
- 禁止改主库：本 agent 只写当前模式的 WAL 产物（`.wal/inspiration_cards.json` / `.wal/volume_arc_skeleton.json` / `.wal/volume_arc_v<N>.json` / `.wal/cluster_<next>_brief_candidates.json`），不直接写 `事件簇.json`、`大势卡.json`、`进度.json`、正文或世界状态（落主库由确定性脚本验收后完成）。
- 禁止凭空造设定（cluster 两模式）：新人物/地点/规则必须来自大势卡、事件簇、世界观、研究引用或已落库伏笔。brainstorm / volume_arc_unit 的故事内容只能从题材+调研 / 选中灵感卡长出来（权威分离铁律）。
- 候选必须可验证（cluster 两模式）：`ripple_match`、`ME_to_advance`、`foreshadowing_to_plant`、`throughline_focus` 引用的 id 必须来自已读材料或本 candidate 新增的 surface 侧明线计划。

