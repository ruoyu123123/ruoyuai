\r
## 🔴 MODE=volume 卷级递归摘要（2026-07-07 S10 · Ex3 摘要金字塔 + source 回溯）\r
\r
卷边界（`save_state --detect-volume-boundary` 产物 `boundary=true`）时，主代理用本模式再 spawn 你一次：把**已完结卷的全部 cluster 摘要**聚合成一条 300-500 字卷级摘要。这是摘要金字塔的第二级：cluster 摘要（第一级）→ 卷摘要（本级），**只聚合 cluster 摘要、不重读全卷正文**。\r
\r
### 输入契约（MODE=volume）\r
\r
```\r
PROJECT: <项目路径>\r
CLUSTER_ID: <cluster_009>            ← 触发卷边界的当前 cluster（= generated_at_cluster）\r
MODE: volume\r
VOLUME_N: <1>                        ← 要聚合的卷号（取 detect 产物 volumes_pending[].volume）\r
VOLUME_CLUSTER_IDS: <cluster_001,cluster_002,...>  ← 本卷全部 cluster_ids（取 detect 产物·不得增删）\r
CLUSTER_SUMMARIES_PATH: _数据库/故事块摘要.json\r
```\r
\r
### 执行流程（MODE=volume）\r
\r
1. **Read** `_数据库/故事块摘要.json`，逐一取 VOLUME_CLUSTER_IDS 中每个 cluster 的账本条目（summary/key_details/emotion）。\r
2. 某 cluster 不在账本（典型 = 本卷末块，其账本条目在 step 10 才建）→ **Read** `_数据库/.wal/<cluster_id>_summary.json` 兜底。两处都没有 → 停止并向主代理报告缺哪个 cluster 的摘要（不许编造）。\r
3. 按时间线把本卷 cluster 摘要聚合成 **300-500 字卷级摘要**：卷核心任务的提出→推进→解决、主角/格局在卷首→卷末的净变化、卷末钩子。只陈述事件不抒情，禁 AI 腔。\r
4. **Write** 到 `_数据库/.wal/volume_<N>_summary.json`。\r
\r
### 输出文件结构（`_数据库/.wal/volume_<N>_summary.json`）\r
\r
```json\r
{\r
  "volume": 1,\r
  "summary": "300-500 字卷级摘要：本卷核心任务提出→推进→解决 + 主角/格局净变化 + 卷末钩子。",\r
  "source": ["cluster_001", "cluster_002", "cluster_003"],\r
  "key_turning_points": ["可选 · ≤5 条 · 每条 ≤30 字的卷内关键转折"],\r
  "emotional_peak": "可选 · 一句话点出本卷情绪峰值所在",\r
  "generated_at_cluster": "cluster_009"\r
}\r
```\r
\r
### 硬性规则（MODE=volume）\r
\r
- `volume`：整数，= VOLUME_N。\r
- `source`：**必须逐一列出 VOLUME_CLUSTER_IDS 全部**（回库入口 `save_state --apply-volume-summary <N>` 做 source 回溯校验：缺一个 = 漏源、多一个 = 幻觉源，**都会被整发拒绝**）。\r
- `generated_at_cluster`：= 输入的 CLUSTER_ID（触发卷边界的当前 cluster）。\r
- 只聚合 cluster 摘要（金字塔纪律），不重读正文、不引入摘要里没有的新事实。\r
- **不 Write 到 `_数据库/故事块摘要.json`** —— 回库唯一入口是主代理跑 `--apply-volume-summary <N>`（确定性校验 + 幂等 upsert）。\r
- 本模式不产 appraisal_beats / scene_summaries / anchor_delivery（那是 MODE=cluster 的活）。\r
\r
### 返回给主代理（MODE=volume）\r
\r
```\r
✅ Summarizer(volume) 完成\r
卷号: <N>\r
摘要字数: <N>\r
source: <n> 个 cluster（=VOLUME_CLUSTER_IDS 全量）\r
输出: _数据库/.wal/volume_<N>_summary.json\r
```"""
